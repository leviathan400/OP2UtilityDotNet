name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # UnitTest is a .NET Framework 4.7.2 MSTest project, so it needs Windows + Visual Studio MSBuild.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild OP2UtilityDotNet.sln /restore /p:RestorePackagesConfig=true /p:Configuration=Release /v:m /nologo

      - name: Test
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find "Common7\IDE\Extensions\TestPlatform\vstest.console.exe" | Select-Object -First 1
          & $vstest UnitTest\bin\Release\UnitTest.dll /logger:trx /ResultsDirectory:TestResults
          exit $LASTEXITCODE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
